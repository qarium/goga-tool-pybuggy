language: python
image: qarium/goga-python-3.13:2.0


.base-ref: &base-ref release/2.0.0

.claude-env: &claude-env
  ANTHROPIC_MODEL: opus
  ANTHROPIC_BASE_URL: "https://api.z.ai/api/anthropic"

build:
  agent: claude
  env:
    <<: *claude-env
    ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.1"
  review:
    agent: claude
    base_ref: *base-ref
    max_iterations: 5
    env:
      <<: *claude-env
      ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.3[1m]"

pipeline:
  agent: claude
  env:
    <<: *claude-env
    ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.3[1m]"

topics:
  base_ref: *base-ref

lint:
  ignore:
    - build/
    - .venv/

usages:
  github:
    goga:
      git: git@github.com:qarium/goga.git
      ref: 2.0.x
      root: goga

codemanifest:
  usages:
    conventions: .goga/usages/conventions.md
  annotations: |
    Use `conventions` for code writing rules and testing.
