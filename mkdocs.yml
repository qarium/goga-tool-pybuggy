site_name: goga-tool-pybuggy
site_description: >-
  pytest plugin and CLI that bootstrap a goga-project for API testing:
  OpenAPI/Swagger-driven fixtures, HTTP runtime, matchcrest matchers,
  and an automated API-test lifecycle.
site_url: https://qarium.github.io/goga-tool-pybuggy/
repo_url: https://github.com/qarium/goga-tool-pybuggy
repo_name: qarium/goga-tool-pybuggy
edit_uri: edit/1.0.x/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: https://avatars.githubusercontent.com/u/262344922?s=200&v=4
  features:
    - navigation.tabs
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
        media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
        media: "(prefers-color-scheme: dark)"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark

# Goga workflow artifacts that live under docs/ but are not user documentation.
exclude_docs: |
  requirements/*
  testcases/*
  arch/*
  design/*
  plans/*
  tasks/*
  bugs/*
  overrides/*

strict: true

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Pipelines: pipelines.md
  - CLI Reference:
      - goga tool pybuggy init: cli/init.md
      - goga tool pybuggy endpoint pull: cli/pull.md
      - goga tool pybuggy endpoint list: cli/list.md
      - goga tool pybuggy endpoint info: cli/info.md
      - goga tool pybuggy endpoint generate: cli/generate.md
  - Configuration: configuration.md
  - Matchers:
      - Overview & assert_that: matchers/index.md
      - Assertions: matchers/asserts.md
      - Matcher Catalog: matchers/matchers.md
  - Pytest Plugin:
      - Enable & Fixtures: plugin/index.md
      - Loaders: plugin/loaders.md
